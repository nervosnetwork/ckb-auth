
name: Rust

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install LLVM 19
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-19 clang-19 lld-19
        echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
    - name: Install tools
      run: cd tests && make install-all
    - name: Build contract
      run: make all-via-docker
    - name: Run all testcases
      run: cd tests && make all
    - name: Run ckb-auth-cli tests
      env:
        # mbedtls-sys-auto still declares a policy version older than CMake 4 supports.
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      run: cd tools/ckb-auth-cli && cargo test
